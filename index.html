<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/profile.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ram Krishna — Backend & DevOps Engineer</title>
    <meta name="description" content="Portfolio of Ram Krishna, a backend and DevOps engineer building scalable APIs, CI/CD pipelines, and cloud infrastructure with Node.js, Docker, AWS, and more." />

    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://github.com" />

    <!-- Preconnect for Google Fonts — critical for font loading speed -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts with display=swap to avoid FOIT (flash of invisible text) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Preload the profile image so it renders without flash -->
    <link rel="preload" as="image" href="/profile.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
